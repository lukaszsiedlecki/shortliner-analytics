server.port=${SERVER_PORT:8082}

spring.application.name=shortliner-analytics

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:50}
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

analytics.aggregation.interval-ms=${AGGREGATION_INTERVAL_MS:300000}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Metrics (scraped by Prometheus)
management.endpoints.web.exposure.include=health,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Distributed tracing (OpenTelemetry). Export is opt-in until a collector
# endpoint is available; toggle via OTEL_TRACING_EXPORT_ENABLED once one is.
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.export.enabled=${OTEL_TRACING_EXPORT_ENABLED:false}

logging.level.com.shortliner.analytics=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.kafka=${LOG_LEVEL_KAFKA:INFO}

# Structured JSON logs (trace/span IDs are included automatically via MDC).
# Unset by default for readable local console output; set to "logstash" or
# "ecs" in environments with a log aggregator (e.g. Loki, ELK).
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:}

# Keycloak resource server. JWKS URI + explicit issuer check instead of issuer-uri: discovery via
# keycloak.local doesn't resolve from pods. Keys are fetched lazily on the first authenticated request.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak.local/realms/shortliner/protocol/openid-connect/certs}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak.local/realms/shortliner}
